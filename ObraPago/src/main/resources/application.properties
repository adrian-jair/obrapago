spring.application.name=obrapago
server.port=8080

# ===== ORACLE =====
spring.datasource.url=${OBRAPAGO_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${OBRAPAGO_DB_USER:OBRAPAGO}
spring.datasource.password=${OBRAPAGO_DB_PASSWORD:123456}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===== CORS =====
app.cors.allowed-origins=http://localhost:4200,http://localhost:5173,http://127.0.0.1:5500

# ===== LOGS =====
logging.level.pe.edu.upeu.obrapago=INFO

# ===== OPENAPI / SWAGGER =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs